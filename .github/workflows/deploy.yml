name: Deploy Pages
on:
  push:
    branches: ["main"] # ou master
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './app/view/templates' # <-- Coloque o nome da sua pasta aqui
      - uses: actions/deploy-pages@v4
