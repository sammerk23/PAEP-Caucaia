<!DOCTYPE html>
<html lang="pt-br">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - PAEP</title>
    
   
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/components/menu.css">
    <link rel="stylesheet" href="../../static/css/paginas/perfil.css">
    <link rel="stylesheet" href="../../static/css/components/modais.css">
</head>
<body>

    <!-- Cabeçalho-->
    <header class="cabecalho-index">
        <!-- Logo do PAEP com link para o Painel Inicial -->
        <div class="logo-menu-container">
            <a href="dashboard.html">
                <img src="../../static/imagens/Logo_Menu.png" alt="Logotipo do sistema PAEP" class="logo">
            </a>
        </div>
        
                <nav class="menu-navegacao">
            <ul>
                <li><a href="dashboard.html">Painel</a></li>
                <li><a href="boletim.html">Boletim</a></li>
                <li><a href="avisos.html">Avisos</a></li>
                <li><a href="calendario.html">Calendário</a></li>
                <li><a href="contato.html">Contatos</a></li>
            </ul>
        </nav>

       
        <a href="perfil.html" class="btn-login">Meu Perfil</a>
    </header>

    <!-- Tela de perfil -->
    <main class="area-perfil">
        
        <div class="profile-container">
            
          
            <div class="page-title-container">
                <svg class="icon title-icon" viewBox="0 0 24 24"><path d="M12,19.2C15.19,19.2 17.89,17.22 18.61,14.28C17.87,13.2 16.65,12.4 15.13,12.1C14.73,12.03 14.31,12 13.9,12H10.1C9.69,12 9.27,12.03 8.87,12.1C7.35,12.4 6.13,13.2 5.39,14.28C6.11,17.22 8.81,19.2 12,19.2M12,5A3,3 0 0,0 9,8A3,3 0 0,0 12,11A3,3 0 0,0 15,8A3,3 0 0,0 12,5M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2Z" /></svg>
                <h1>Meu Perfil</h1>
            </div>
    
            <!-- Início do Formulário -->
            <form id="form-perfil">
                
                <!-- SEÇÃO 1: Dados Pessoais -->
                <div class="section-divider">
                    <span>Dados Pessoais</span>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" value="Maria Joaquina" required> 
                    </div>
                    <div class="form-group">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" value="Sousa da Silva Ramos de Holanda" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="marijoa@estude.com" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" value="(88) 99200-9292" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" value="123.987.555-90">
                    </div>
                    <div class="form-group">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" name="rg" value="12.345.789-9">
                    </div>
                </div>
    
                <!-- SEÇÃO 2: Endereço -->
                <div class="section-divider">
                    <span>Endereço</span>
                </div>
               
                <div class="form-row">
                    <div class="form-group">
                        <label for="logradouro">Logradouro</label>
                        <input type="text" id="logradouro" name="logradouro" value="Rua Carmo da Rocha Soares Brandão">
                    </div>
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" value="88098-000">
                    </div>
                </div>
               
                <div class="form-row">
                    <div class="form-group small">
                        <label for="numero">Numero</label>
                        <input type="text" id="numero" name="numero" value="1098">
                    </div>
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" value="Alto da Colina">
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="Campina do Norte">
                    </div>
                    <div class="form-group small">
                        <label for="uf">UF</label>
                        <input type="text" id="uf" name="uf" value="Ceará">
                    </div>
                </div>
    
                <!-- SEÇÃO 3: Tabela de Alunos Dependentes -->
                <div class="section-divider">
                    <span>Dependentes</span>
                </div>
                <table>
                    
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Matrícula</th>
                            <th>Serie/Ano</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <tr>
                            <td>José Ferreira da Silva Ramos</td>
                            <td>202600123</td>
                            <td>9<sup>º</sup> Ano do Ensino Fundamental</td>
                        </tr>
                        <tr>
                            <td>Marina da Silva Ramos</td>
                            <td>202600124</td>
                            <td>7<sup>º</sup> Ano do Ensino Fundamental</td>
                        </tr>
                    </tbody>
                </table>
    
                <!-- Botões -->
                <div class="button-container">
                    <button type="submit" class="btn-save">Salvar</button>
                    <button type="button" class="btn-cancel">Cancelar</button>
                </div>

            </form>
        </div>
    </main>

    <div id="modal-atencao" class="modal">
        <div class="modal-conteudo-atencao"> 
            <img src="../../static/imagens/atencao.png" alt="Ícone de atenção" class="modal-atencao-icone">
            <h3 class="title-atencao"></h3>
            <p class="text-atencao"></p>
            <div class="modal-footer">
                <button id="modal-atencao-confirmar" class="btn-confirmar">Confirmar</button>
                <button id="modal-atencao-cancelar" class="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modal-atencaoSimples" class="modal">
        <div class="modal-conteudo-atencao"> 
            <img src="../../static/imagens/atencao.png" alt="Ícone de atenção" class="modal-atencao-icone">
            <h3 class="title-atencao"></h3>
            <p class="text-atencao"></p>
        </div>
    </div>

    <div id="modal-sucesso" class="modal">
        <div class="modal-conteudo-save">
            <img src="../../static/imagens/salvo.png" alt="Ícone de confirmação" class="modal-save-icone">
            <h3 class="title-success"></h3>
            <p class="text-success"></p>
        </div>
    </div>

    <div id="modal-error" class="modal">
        <div class="modal-conteudo-error">
            <img src="../../static/imagens/erro.png" alt="Ícone de erro" class="modal-error-icone">
            <h3 class="title-error"></h3>
            <p class="text-error"></p>
        </div>
    </div>

    <script src="../../static/js/components.js"></script>
    <script src="../../static/js/perfil.js"></script>

</body>
</html>
