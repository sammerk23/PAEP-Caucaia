<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - PAEP</title>
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/components/menu.css">
    <link rel="stylesheet" href="../../static/css/components/apresentacao_secao.css">
    <link rel="stylesheet" href="../../static/css/paginas/contate-nos.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="cabecalho-index">
        <div class="logo-menu-container">
            <a href="dashboard.html">
                <img src="../../static/imagens/Logo_Menu.png" alt="Logotipo do sistema PAEP" class="logo">
            </a>
        </div>
    
        <nav class="menu-navegacao">
            <ul>
                <li><a href="dashboard.html">Painel</a></li>
                <li><a href="boletim.html">Boletim</a></li>
                <li><a href="avisos.html">Avisos</a></li>
                <li><a href="calendario.html">Calendário</a></li>
                <li><a href="contato.html">Contatos</a></li>
            </ul>
        </nav>

        <a href="perfil.html" class="btn-login">Meu Perfil</a>
        
    </header>
    <main class="conteudo">
        <section class="contato" aria-labelledby="titulo-contato">
            <h1 id="titulo-contato">Contate-nos</h1>

            <form class="formulario" action="#" method="POST">
                <div class="campos">
                    <input type="text" name="nome" placeholder="Nome" aria-label="Nome" required>
                    <input type="email" name="email" placeholder="E-mail" aria-label="E-mail" required>
                    <input type="text" name="assunto" placeholder="Assunto" aria-label="Assunto" required>
                </div>

                <textarea name="mensagem" placeholder="Mensagem" aria-label="Mensagem" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

</body>
</html>
