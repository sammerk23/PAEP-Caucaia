<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PAEP</title>
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/components/menu.css">
    <link rel="stylesheet" href="../../static/css/paginas/login.css">
</head>
<body>
    <main class="container-login">
        <section class="login-imagem">
            <div class="imagem-placeholder-login">
                <img src="../../static/imagens/Fundo_login.png" alt="Pais e filho no PC" class="imagem-login">
            </div>
        </section>

        <section class="login-formulario-area">
            <div class="login-box">
                <img src="../../static/imagens/Logo_Login.png" alt="Logotipo do Sistema PAEP" class="logo-login">

                <form action="dashboard.html" method="GET" class="form-login">

                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    <button type="submit" class="btn-acessar">Acessar</button>
                    
                    <a href="#" id="link-esqueci-senha" class="link-esqueceu-senha">Esqueceu a senha?</a>

                    <div id="info-contato-escola" class="info-contato-oculta">
                        <p>Entre em contato com a coordenação da escola:</p>
                        <ul>
                            <li><strong>Email:</strong> contato@paep.com.br</li>
                            <li><strong>Telefone:</strong> (88) 9XXXX-XXXX</li>
                        </ul>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <script src="../../static/js/login.js"></script>
</body>
</html>
